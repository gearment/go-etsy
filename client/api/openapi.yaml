          description: The minimum number of days or weeks for processing a specific
            product.
          maximum: 10
          minimum: 1
          type: integer
        max_processing_time:
          description: The maximum number of days or weeks for processing a specific
            product.
          maximum: 10
          minimum: 1
          type: integer
        processing_time_unit:
          $ref: "#/components/schemas/createShopReadinessStateDefinition_request_processing_time_unit"
      required:
      - max_processing_time
      - min_processing_time
      - readiness_state
      type: object
    updateShopReadinessStateDefinition_request:
      properties:
        readiness_state:
          $ref: "#/components/schemas/createShopReadinessStateDefinition_request_readiness_state"
        min_processing_time:
          description: The minimum number of days or weeks for processing a specific
            product.
          maximum: 10
          minimum: 1
          type: integer
        max_processing_time:
          description: The maximum number of days or weeks for processing a specific
            product.
