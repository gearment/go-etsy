      description: "When _updating_ a listing, this value can be either `active` or\
        \ `inactive`. Note: Setting a `draft` listing to `active` will also publish\
        \ the listing on etsy.com and requires that the listing have an image set.\
        \ Setting a `sold_out` listing to active will update the quantity to 1 and\
        \ renew the listing on etsy.com."
      enum:
      - active
      - inactive
      - sold_out
      - draft
      - expired
      type: string
    ShopListing_who_made:
      description: An enumerated string indicating who made the product. Helps buyers
        locate the listing under the Handmade heading. Requires 'is_supply' and 'when_made'.
      enum:
      - i_did
      - someone_else
      - collective
      nullable: true
      type: string
    ShopListing_when_made:
      description: An enumerated string for the era in which the maker made the product
        in this listing. Helps buyers locate the listing under the Vintage heading.
        Requires 'is_supply' and 'who_made'.
      enum:
      - made_to_order
      - 2020_2026
      - 2010_2019
      - 2007_2009
      - before_2007
      - 2000_2006
      - 1990s
      - 1980s
      - 1970s
      - 1960s
      - 1950s
      - 1940s
      - 1930s
      - 1920s
      - 1910s
      - 1900s
      - 1800s
      - 1700s
