        \ a set of countries. Supported regions are Europe Union and Non-Europe Union\
        \ (countries in Europe not in EU). If `none`, request sets destination to\
        \ destination_country_iso. Required if destination_country_iso is null or\
        \ not provided."
      enum:
      - eu
      - non_eu
      - none
      type: string
