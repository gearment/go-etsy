        Endpoint to list Listings that belong to a Shop. Listings can be filtered using the 'state' param.
      operationId: getListingsByShop
      parameters:
      - description: The unique positive non-zero numeric ID for an Etsy Shop.
        explode: false
        in: path
        name: shop_id
        required: true
        schema:
          description: The unique positive non-zero numeric ID for an Etsy Shop.
          format: int64
          minimum: 1
          type: integer
        style: simple
      - description: "When _updating_ a listing, this value can be either `active`\
          \ or `inactive`. Note: Setting a `draft` listing to `active` will also publish\
          \ the listing on etsy.com and requires that the listing have an image set.\
          \ Setting a `sold_out` listing to active will update the quantity to 1 and\
          \ renew the listing on etsy.com."
        explode: true
        in: query
        name: state
        required: false
        schema:
          $ref: "#/components/schemas/getListingsByShop_state_parameter"
        style: form
      - description: The maximum number of results to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          description: The maximum number of results to return.
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: The number of records to skip before selecting the first result.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: The number of records to skip before selecting the first result.
          minimum: 0
          type: integer
        style: form
      - description: "The value to sort a search result of listings on. NOTES: a)\
          \ `sort_on` only works when combined with one of the search options (keywords,\
          \ region, etc.). b) when using `score` the returned results will always\
          \ be in _descending_ order, regardless of the `sort_order` parameter."
        explode: true
        in: query
        name: sort_on
        required: false
        schema:
          $ref: "#/components/schemas/getListingsByShop_sort_on_parameter"
        style: form
      - description: "The ascending(up) or descending(down) order to sort listings\
          \ by. NOTE: sort_order only works when combined with one of the search options\
          \ (keywords, region, etc.)."
        explode: true
        in: query
        name: sort_order
        required: false
        schema:
          $ref: "#/components/schemas/getListingsByShop_sort_order_parameter"
        style: form
      - description: "An enumerated string that attaches a valid association. Acceptable\
          \ inputs are 'Shipping', 'Shop', 'Images', 'User', 'Translations', 'Videos',\
          \ 'Inventory' and 'Personalization'."
        explode: true
        in: query
        name: includes
        required: false
        schema:
          description: "An enumerated string that attaches a valid association. Acceptable\
            \ inputs are 'Shipping', 'Shop', 'Images', 'User', 'Translations', 'Videos',\
            \ 'Inventory' and 'Personalization'."
          items:
            $ref: "#/components/schemas/getListingsByShop_includes_parameter_inner"
          type: array
        style: form
      - description: This parameter needed to enable new parameters and response values
          related to processing profiles.
        explode: true
        in: query
        name: legacy
        required: false
        schema:
          description: This parameter needed to enable new parameters and response
            values related to processing profiles.
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopListingsWithAssociations"
          description: A list of Listings
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSchema"
          description: There was a problem with the request data. See the error message
            for details.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSchema"
          description: The request lacks valid authentication credentials. See the
            error message for details.
        "403":
