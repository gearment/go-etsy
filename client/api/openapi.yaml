            \ values. For example, if your listing offers different sizes of a product,\
            \ then the value ID list contains value IDs for each size."
          items:
            format: int64
            minimum: 1
            type: integer
          type: array
        scale_id:
          description: "The numeric ID of a single Etsy.com measurement scale. For\
            \ example, for shoe size, there are three `scale_id`s available - `UK`,\
            \ `US/Canada`, and `EU`, where `US/Canada` has `scale_id` 19."
          format: int64
          minimum: 1
          nullable: true
          type: integer
        property_name:
          description: "The name of the property, in the requested locale language."
          type: string
        values:
          description: "A list of property value entries for this product. Note: parenthesis\
            \ characters (`(` and `)`) are not allowed."
          items:
            type: string
          type: array
      required:
      - property_id
      - value_ids
      - values
      type: object
    updateListingInventory_request_products_inner_offerings_inner:
      properties:
        price:
          description: The price of the product.
          format: float
          type: number
        quantity:
          description: How many of this product are available?
          type: integer
        is_enabled:
          description: True if the offering is shown to buyers
          type: boolean
        readiness_state_id:
          description: "The numeric ID of the [processing profile](/documentation/reference#operation/getShopReadinessStateDefinition)\
            \ associated with the listing. Returned only when the listing is `active`\
            \ and of type `physical`, and the endpoint is either shop-scoped (path\
            \ contains `shop_id`) or a single-listing request such as `getListing`.\
            \ For every other case this field can be null."
          format: int64
          minimum: 1
          nullable: true
          type: integer
      required:
      - is_enabled
      - price
      - quantity
      - readiness_state_id
      type: object
    updateListingInventory_request_products_inner:
      properties:
        sku:
          description: The SKU string for the product
          nullable: true
          type: string
        property_values:
          description: "A list of property value entries for this product. Note: parenthesis\
            \ characters (`(` and `)`) are not allowed."
          items:
            $ref: "#/components/schemas/updateListingInventory_request_products_inner_property_values_inner"
          type: array
        offerings:
          description: A list of product offering entries for this product.
          items:
            $ref: "#/components/schemas/updateListingInventory_request_products_inner_offerings_inner"
          type: array
      required:
      - offerings
      type: object
    updateListingInventory_request:
      properties:
        products:
          description: "A JSON array of products available in a listing, even if only\
            \ one product. All field names in the JSON blobs are lowercase."
          items:
            $ref: "#/components/schemas/updateListingInventory_request_products_inner"
          type: array
        price_on_property:
          description: "An array of unique [listing property](/documentation/reference#operation/getListingProperties)\
            \ ID integers for the properties that change product prices, if any. For\
            \ example, if you charge specific prices for different sized products\
            \ in the same listing, then this array contains the property ID for size."
          items:
            type: integer
          type: array
        quantity_on_property:
          description: "An array of unique [listing property](/documentation/reference#operation/getListingProperties)\
            \ ID integers for the properties that change the quantity of the products,\
            \ if any. For example, if you stock specific quantities of different colored\
            \ products in the same listing, then this array contains the property\
            \ ID for color."
          items:
            type: integer
          type: array
        sku_on_property:
          description: "An array of unique [listing property](/documentation/reference#operation/getListingProperties)\
            \ ID integers for the properties that change the product SKU, if any.\
            \ For example, if you use specific skus for different colored products\
            \ in the same listing, then this array contains the property ID for color."
          items:
            type: integer
          type: array
        readiness_state_on_property:
          description: "An array of unique [listing property](/documentation/reference#operation/getListingProperties)\
            \ ID integers for the properties that change processing profile, if any.\
            \ For example, if you need specific processing profiles for different\
            \ colored products in the same listing, then this array contains the property\
            \ ID for color."
          items:
            format: int64
            minimum: 1
            type: integer
          nullable: true
          type: array
      required:
      - products
      type: object
    updateListingPersonalization_request_personalization_questions_inner_question_type:
      description: "The type of the personalization question. Note: Currently, only\
        \ a single question with type 'text_input' is supported. See https://developers.etsy.com/documentation/tutorials/personalization-migration\
        \ for details about new question types."
      enum:
      - text_input
      type: string
    updateListingPersonalization_request_personalization_questions_inner_options_inner:
      properties:
        option_id:
          description: "The ID of the option. Note: This value may change if the option\
            \ or question is updated."
          format: int64
          minimum: 1
          nullable: true
          type: integer
        label:
          description: "The option label. Note: For 'dropdown' questions, max length\
            \ is 20 characters. For 'labeled_upload' questions, max length is 45 characters."
          type: string
      required:
      - label
      - option_id
      type: object
    updateListingPersonalization_request_personalization_questions_inner:
      properties:
        question_id:
          description: "The ID of the personalization question. Note: This value may\
            \ change if the personalization question is updated."
          format: int64
          minimum: 1
          nullable: true
          type: integer
        question_text:
          description: "The title of the personalization question. Must be between\
            \ 1 and 45 characters. Note: During the migration to the new personalization\
            \ endpoints, if you're still using a legacy UI (without a title input),please\
            \ send the default value 'Personalization'."
          type: string
        instructions:
          description: "Optional instructions for a personalization question. For\
            \ legacy, single personalization, max length is 256 characters. Once multiple\
            \ personalization questions are enabled, the max length will be 120 characters."
          nullable: true
          type: string
        question_type:
          $ref: "#/components/schemas/updateListingPersonalization_request_personalization_questions_inner_question_type"
        required:
          description: "When true, the personalization question is required."
          type: boolean
        max_allowed_files:
          description: "The maximum number of files the buyer may upload in response\
            \ to a personalization question. Note: This value is only applicable to\
            \ 'unlabeled_upload' and 'labeled_upload' questions."
          nullable: true
          type: integer
        max_allowed_characters:
          description: "The maximum number of characters the buyer may enter in response\
            \ to a personalization question. Note: This value is only applicable to\
            \ 'text_input' questions."
          nullable: true
          type: integer
        options:
          description: "The list of options for a personalization question. For 'dropdown'\
            \ questions, this list contains the options for the dropdown. For 'labeled_upload'\
            \ questions, this list contains the labels for the files that the buyer\
            \ may upload, and must match the max_allowed_files value.."
          items:
            $ref: "#/components/schemas/updateListingPersonalization_request_personalization_questions_inner_options_inner"
          nullable: true
          type: array
      required:
      - instructions
      - max_allowed_characters
      - max_allowed_files
      - options
      - question_id
      - question_text
      - question_type
      - required
      type: object
    updateListingPersonalization_request:
      properties:
        personalization_questions:
          items:
            $ref: "#/components/schemas/updateListingPersonalization_request_personalization_questions_inner"
          type: array
      required:
      - personalization_questions
      type: object
    updateListingProperty_request:
      properties:
        value_ids:
          description: "An array of unique IDs of multiple Etsy [listing property](/documentation/reference#operation/getListingProperties)\
            \ values. For example, if your listing offers different sizes of a product,\
            \ then the value ID list contains value IDs for each size."
          items:
            format: int64
            minimum: 1
            type: integer
          type: array
        values:
          description: "An array of value strings for multiple Etsy [listing property](/documentation/reference#operation/getListingProperties)\
            \ values. For example, if your listing offers different colored products,\
            \ then the values array contains the color strings for each color. Note:\
            \ parenthesis characters (`(` and `)`) are not allowed."
          items:
            type: string
          type: array
        scale_id:
          description: "The numeric ID of a single Etsy.com measurement scale. For\
            \ example, for shoe size, there are three `scale_id`s available - `UK`,\
            \ `US/Canada`, and `EU`, where `US/Canada` has `scale_id` 19."
          format: int64
          minimum: 1
          type: integer
      required:
      - value_ids
      - values
      type: object
    updateListingTranslation_request:
      properties:
        title:
          description: The title of the Listing of this Translation.
          type: string
        description:
          description: The description of the Listing of this Translation.
          type: string
        tags:
          description: The tags of the Listing of this Translation.
          items:
            type: string
          type: array
      required:
      - description
      - title
      type: object
    updateListing_request_item_weight_unit:
      description: A string defining the units used to measure the weight of the product.
        Default value is null.
      enum:
      - ""
      - oz
      - lb
      - g
      - kg
      nullable: true
      type: string
    updateListing_request_item_dimensions_unit:
      description: A string defining the units used to measure the dimensions of the
        product. Default value is null.
      enum:
      - ""
      - in
      - ft
      - mm
      - cm
      - m
      - yd
      - inches
      nullable: true
      type: string
    updateListing_request_state:
      description: "When _updating_ a listing, this value can be either `active` or\
        \ `inactive`. Note: Setting a `draft` listing to `active` will also publish\
        \ the listing on etsy.com and requires that the listing have an image set.\
        \ Setting a `sold_out` listing to active will update the quantity to 1 and\
        \ renew the listing on etsy.com."
      enum:
      - active
      - inactive
      type: string
    updateListing_request_type:
      description: An enumerated type string that indicates whether the listing is
        physical or a digital download.
      enum:
      - physical
      - download
      - both
      nullable: true
      type: string
    updateListing_request:
      properties:
        image_ids:
          description: "An array of numeric image IDs of the images in a listing,\
            \ which can include up to 20 images."
          items:
            format: int64
            minimum: 1
            type: integer
          type: array
        title:
          description: "The listing's title string. When creating or updating a listing,\
            \ valid title strings contain only letters, numbers, punctuation marks,\
            \ mathematical symbols, whitespace characters, ™, ©, and ®. (regex: /[^\\\
            p{L}\\p{Nd}\\p{P}\\p{Sm}\\p{Zs}™©®]/u) You can only use the %, :, & and\
            \ + characters once each."
          type: string
        description:
          description: A description string of the product for sale in the listing.
          type: string
        materials:
          description: "A list of material strings for materials used in the product.\
            \ Valid materials strings contain only letters, numbers, and whitespace\
            \ characters. (regex: /[^\\p{L}\\p{Nd}\\p{Zs}]/u) Default value is null."
          items:
            type: string
          nullable: true
          type: array
        should_auto_renew:
          description: "When true, renews a listing for four months upon expiration."
          type: boolean
        shipping_profile_id:
          description: "The numeric ID of the [shipping profile](/documentation/reference#operation/getShopShippingProfile)\
            \ associated with the listing. Required when listing type is `physical`."
          format: int64
          minimum: 1
          nullable: true
          type: integer
        return_policy_id:
          description: "The numeric ID of the [Return Policy](/documentation/reference#operation/getShopReturnPolicies).\
            \ Required for active physical listings. This requirement does not apply\
            \ to listings of EU-based shops."
          format: int64
          minimum: 1
          nullable: true
          type: integer
        shop_section_id:
          description: "The numeric ID of the [shop section](/documentation/reference#tag/Shop-Section)\
            \ for this listing. Default value is null."
          nullable: true
          type: integer
        item_weight:
          description: "The numeric weight of the product measured in units set in\
            \ 'item_weight_unit'. Default value is null. If set, the value must be\
            \ greater than 0."
          format: float
          maximum: 
          minimum: 0
          nullable: true
          type: number
        item_length:
          description: "The numeric length of the product measured in units set in\
            \ 'item_dimensions_unit'. Default value is null. If set, the value must\
            \ be greater than 0."
          format: float
          maximum: 
          minimum: 0
          nullable: true
          type: number
        item_width:
          description: "The numeric width of the product measured in units set in\
            \ 'item_dimensions_unit'. Default value is null. If set, the value must\
            \ be greater than 0."
          format: float
          maximum: 
          minimum: 0
          nullable: true
          type: number
        item_height:
          description: "The numeric height of the product measured in units set in\
            \ 'item_dimensions_unit'. Default value is null. If set, the value must\
            \ be greater than 0."
          format: float
          maximum: 
          minimum: 0
          nullable: true
          type: number
        item_weight_unit:
          $ref: "#/components/schemas/updateListing_request_item_weight_unit"
        item_dimensions_unit:
          $ref: "#/components/schemas/updateListing_request_item_dimensions_unit"
        is_taxable:
          description: "When true, applicable [shop](/documentation/reference#tag/Shop)\
            \ tax rates apply to this listing at checkout."
          type: boolean
        taxonomy_id:
          description: "The numerical taxonomy ID of the listing. See [SellerTaxonomy](/documentation/reference#tag/SellerTaxonomy)\
            \ and [BuyerTaxonomy](/documentation/reference#tag/BuyerTaxonomy) for\
            \ more information."
          format: int64
          minimum: 1
          type: integer
        tags:
          description: "A comma-separated list of tag strings for the listing. When\
            \ creating or updating a listing, valid tag strings contain only letters,\
            \ numbers, whitespace characters, -, ', ™, ©, and ®. (regex: /[^\\p{L}\\\
            p{Nd}\\p{Zs}\\-'™©®]/u) Default value is null."
          items:
            type: string
          nullable: true
          type: array
        who_made:
          $ref: "#/components/schemas/createDraftListing_request_who_made"
        when_made:
          $ref: "#/components/schemas/createDraftListing_request_when_made"
        featured_rank:
          description: "The positive non-zero numeric position in the featured listings\
            \ of the shop, with rank 1 listings appearing in the left-most position\
            \ in featured listing on a shop's home page."
          nullable: true
          type: integer
        is_personalizable:
          description: "When true, this listing is personalizable. The default value\
            \ is false."
          type: boolean
        personalization_is_required:
          description: "[DEPRECATED] When true, this listing requires personalization.\
            \ The default value is false. NOTE: This field will be removed on Apr.\
            \ 9th, 2026. See https://developers.etsy.com/documentation/tutorials/personalization-migration\
            \ for migration details."
          type: boolean
        personalization_char_count_max:
          description: "[DEPRECATED] This is an integer value representing the maximum\
            \ length for the personalization message entered by the buyer. Will only\
            \ change if is_personalizable is 'true'. Note: This field will be removed\
            \ on Apr. 9th, 2026. See https://developers.etsy.com/documentation/tutorials/personalization-migration\
            \ for migration details."
          type: integer
        personalization_instructions:
          description: "[DEPRECATED] A string representing instructions for the buyer\
            \ to enter the personalization. Will only change if is_personalizable\
            \ is 'true'. Note: This field will be removed on Apr. 9th, 2026. See https://developers.etsy.com/documentation/tutorials/personalization-migration\
            \ for migration details."
          type: string
        state:
          $ref: "#/components/schemas/updateListing_request_state"
        is_supply:
          description: "When true, tags the listing as a supply product, else indicates\
            \ that it's a finished product. Helps buyers locate the listing under\
            \ the Supplies heading. Requires 'who_made' and 'when_made'."
          type: boolean
        production_partner_ids:
          description: An array of unique IDs of production partner ids.
          items:
            format: int64
            minimum: 1
            type: integer
          nullable: true
          type: array
        type:
          $ref: "#/components/schemas/updateListing_request_type"
      type: object
    updateVariationImages_request_variation_images_inner:
      properties:
        property_id:
